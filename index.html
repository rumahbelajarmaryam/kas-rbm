<title>Kas Rumah Belajar Maryam</title>
<style>
:root{--g:#0f766e;--g2:#14b8a6;--bg:#f4f7f6;--card:#fff;--tx:#1b2b29;--mut:#64748b;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--line:#e2e8f0}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:100px}
header.top{background:var(--g);color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top))}
header.top h1{margin:0;font-size:19px}
header.top small{opacity:.85}
main{max-width:720px;margin:0 auto;padding:14px}
h2{font-size:17px;margin:4px 0 10px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.big{font-size:28px;font-weight:700}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mut{color:var(--mut);font-size:14px}
.badge{padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.b-ok{background:#dcfce7;color:var(--ok)}.b-warn{background:#fef3c7;color:var(--warn)}.b-bad{background:#fee2e2;color:var(--bad)}.b-off{background:#e2e8f0;color:#475569}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.in{color:var(--ok);font-weight:600;white-space:nowrap}.out{color:var(--bad);font-weight:600;white-space:nowrap}
button,.btn{font:inherit;border:0;border-radius:10px;padding:10px 16px;background:var(--g);color:#fff;font-weight:600;cursor:pointer}
.btn2{background:#e6f4f1;color:var(--g)}.btnr{background:#fee2e2;color:var(--bad)}.full{width:100%}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:var(--tx)}
input[type=checkbox]{width:auto}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:8px 2px;font-size:12px;font-weight:600}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--g)}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;font-size:30px;padding:0;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:6}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
#overlay.on{display:flex}
#sheet{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
.seg{display:flex;gap:8px;margin-bottom:6px}
.seg button{flex:1;background:#e2e8f0;color:#334155}
.seg button.on{background:var(--g);color:#fff}
.seg button.on.m{background:var(--ok)}.seg button.on.k{background:var(--bad)}
.bar{height:8px;background:#e2e8f0;border-radius:9px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--g2)}
.banner{background:#fef3c7;color:#78350f;border-radius:12px;padding:12px;margin-bottom:12px}
.chip{display:inline-flex;gap:8px;align-items:center;background:#e6f4f1;color:var(--g);padding:4px 12px;border-radius:99px;margin:3px;font-size:14px}
.chip b{cursor:pointer;color:var(--bad)}
.empty{text-align:center;color:var(--mut);padding:18px 8px}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;display:none;z-index:50;max-width:90%}
.printonly{display:none}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right}
@media print{
 body{background:#fff;font-size:12pt;padding:0}
 header.top,nav,.fab,.noprint,#overlay,#toast{display:none!important}
 .printonly{display:block}
 .card{box-shadow:none;border:1px solid #cbd5e1;break-inside:avoid}
 main{max-width:none;padding:0}
}
</style>
</head>

const KEY='rbm_keuangan_v1';
const IURAN='Iuran bulanan';
const BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const DEF={lembaga:'Rumah Belajar Maryam',saldoAwal:0,murid:[],trx:[],
 katMasuk:[IURAN,'Pendaftaran','Fun Holiday','Donasi','Lainnya'],
 katKeluar:['Honor guru','Listrik dan air','Alat belajar','Konsumsi kegiatan','Sewa dan perawatan','Lainnya'],lastBackup:''};
const clone=o=>JSON.parse(JSON.stringify(o));
const $=s=>document.querySelector(s);
const rp=n=>(n<0?'-':'')+'Rp'+new Intl.NumberFormat('id-ID').format(Math.abs(Math.round(n||0)));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const thisMonth=()=>today().slice(0,7);
const namaBulan=ym=>{const [y,m]=ym.split('-');return BULAN[+m-1]+' '+y;};
const tglIndo=s=>{const [y,m,d]=s.split('-');return (+d)+' '+BULAN[+m-1].slice(0,3)+' '+y;};
const num=v=>+(String(v==null?'':v).replace(/\D/g,''))||0;
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
const fmtNum=n=>n?new Intl.NumberFormat('id-ID').format(n):'';

let db=load();
function load(){
 try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.trx)&&Array.isArray(d.murid))return Object.assign(clone(DEF),d);}catch(e){}
 return clone(DEF);
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){toast('Gagal menyimpan, penyimpanan perangkat mungkin penuh');}}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200);}

const S={tab:'beranda',bulanIuran:thisMonth(),bulanLap:thisMonth(),lapMode:'bulan',tglTerima:today()};
let lastBatch=[];
let deferredInstall=null;

/* ---------- helper data ---------- */
function totals(list){return {masuk:sum(list.filter(t=>t.tipe==='masuk'),t=>t.jumlah),keluar:sum(list.filter(t=>t.tipe==='keluar'),t=>t.jumlah)};}
function paidFor(id,ym){return sum(db.trx.filter(t=>t.tipe==='masuk'&&t.kategori===IURAN&&t.muridId===id&&t.bulan===ym),t=>t.jumlah);}
function wajib(m,ym){return (m.mulai||'0000-00')<=ym&&(m.aktif?true:ym<(m.berhenti||'0000-00'));}
function muridNama(id){const m=db.murid.find(x=>x.id===id);return m?m.nama:'';}
function statusIuran(m,ym){
 const p=paidFor(m.id,ym);
 if(p>=m.tarif)return {k:'ok',t:'Lunas',p};
 if(p>0)return {k:'warn',t:'Sebagian',p};
 return {k:'bad',t:'Belum',p};
}
const cmpDesc=(a,b)=>b.tgl.localeCompare(a.tgl)||b.id.localeCompare(a.id);
const cmpAsc=(a,b)=>a.tgl.localeCompare(b.tgl)||a.id.localeCompare(b.id);
function group(list){const o={};list.forEach(t=>o[t.kategori]=(o[t.kategori]||0)+t.jumlah);return Object.entries(o).sort((a,b)=>b[1]-a[1]);}

/* ---------- navigasi ---------- */
function go(t){if(t==='iuran'&&S.tab!=='iuran')S.tglTerima=today();S.tab=t;render();window.scrollTo(0,0);}
function render(){
 $('#title').textContent=db.lembaga||'Kas';
 const views={beranda:vBeranda,iuran:vIuran,murid:vMurid,laporan:vLaporan,atur:vAtur};
 $('#app').innerHTML=views[S.tab]();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
 $('#fab').style.display=(S.tab==='atur')?'none':'block';
}
function openSheet(h){$('#sheet').innerHTML=h;$('#overlay').classList.add('on');}
function closeSheet(){$('#overlay').classList.remove('on');}

/* ---------- tampilan: beranda ---------- */
function trxRow(t){
 const nm=t.muridId?muridNama(t.muridId):'';
 const judul=t.kategori+(nm?' - '+nm:'')+(t.bulan?' ('+namaBulan(t.bulan)+')':'');
 return `<div class="item" onclick="openTrx('${t.id}')"><div class="grow"><div>${esc(judul)}</div><div class="mut">${tglIndo(t.tgl)}${t.ket?' &middot; '+esc(t.ket):''}</div></div><div class="${t.tipe==='masuk'?'in':'out'}">${t.tipe==='masuk'?'+':'-'}${rp(t.jumlah)}</div></div>`;
}
function vBeranda(){
 const ym=thisMonth(),all=totals(db.trx),bln=totals(db.trx.filter(t=>t.tgl.slice(0,7)===ym));
 const saldo=db.saldoAwal+all.masuk-all.keluar;
 const wm=db.murid.filter(m=>wajib(m,ym));
 const target=sum(wm,m=>m.tarif),kumpul=sum(wm,m=>Math.min(paidFor(m.id,ym),m.tarif));
 const belum=wm.filter(m=>paidFor(m.id,ym)<m.tarif).length;
 const pct=target?Math.round(kumpul/target*100):0;
 let ban='';
 if(db.trx.length>0){
  const hari=db.lastBackup?Math.floor((Date.now()-new Date(db.lastBackup).getTime())/864e5):999;
  if(hari>=30)ban=`<div class="banner">Data belum dicadangkan ${db.lastBackup?hari+' hari':'sama sekali'}. Buka menu Atur lalu tekan Unduh cadangan, supaya catatan aman kalau HP atau tablet bermasalah.</div>`;
 }
 const recent=db.trx.slice().sort(cmpDesc).slice(0,6);
 return `${ban}
 <div class="card"><div class="mut">Saldo kas saat ini</div><div class="big">${rp(saldo)}</div></div>
 <div class="grid2">
  <div class="card"><div class="mut">Masuk ${namaBulan(ym)}</div><div class="in" style="font-size:19px">${rp(bln.masuk)}</div></div>
  <div class="card"><div class="mut">Keluar ${namaBulan(ym)}</div><div class="out" style="font-size:19px">${rp(bln.keluar)}</div></div>
 </div>
 <div class="card"><h2>Iuran ${namaBulan(ym)}</h2>
  ${wm.length?`<div class="row"><div class="grow">Terkumpul ${rp(kumpul)} dari ${rp(target)}</div><b>${pct}%</b></div><div class="bar"><i style="width:${pct}%"></i></div>
  <p class="mut" style="margin:8px 0 10px">${belum?belum+' murid belum lunas bulan ini.':'Semua murid sudah lunas bulan ini. Alhamdulillah.'}</p>
  <button class="full" onclick="S.bulanIuran=thisMonth();go('iuran')">Catat iuran bulan ini</button>`
  :`<p class="mut">Belum ada murid. Tambahkan murid dulu di menu Murid supaya iuran bisa dilacak satu per satu.</p><button class="btn2 full" onclick="go('murid')">Ke menu Murid</button>`}
 </div>
 <div class="card"><h2>Transaksi terakhir</h2>${recent.length?recent.map(trxRow).join(''):'<div class="empty">Belum ada catatan. Tekan tombol + untuk mencatat yang pertama.</div>'}</div>`;
}

/* ---------- tampilan: iuran ---------- */
function vIuran(){
 const ym=S.bulanIuran;
 const list=db.murid.filter(m=>wajib(m,ym)).map(m=>({m,s:statusIuran(m,ym)}));
 const ord={bad:0,warn:1,ok:2};
 list.sort((a,b)=>ord[a.s.k]-ord[b.s.k]||a.m.nama.localeCompare(b.m.nama));
 const target=sum(list,x=>x.m.tarif),kumpul=sum(list,x=>Math.min(x.s.p,x.m.tarif));
 const lunas=list.filter(x=>x.s.k==='ok').length;
 const belum=list.length-lunas;
 return `<div class="card"><div class="grid2"><div><label style="margin-top:0">Bulan iuran</label>
  <input type="month" value="${ym}" onchange="S.bulanIuran=this.value||thisMonth();render()"></div>
  <div><label style="margin-top:0">Tanggal diterima</label><input type="date" value="${S.tglTerima}" onchange="S.tglTerima=this.value||today()"></div></div>
  ${list.length?`<p style="margin:12px 0 4px">Terkumpul <b>${rp(kumpul)}</b> dari target ${rp(target)}. Lunas ${lunas} dari ${list.length} murid.</p>
  <div class="bar"><i style="width:${target?Math.round(kumpul/target*100):0}%"></i></div>
  ${belum?`<button class="full" style="margin-top:12px" onclick="semuaLunas()">Tandai semua yang belum sebagai lunas (${belum})</button>`:''}`:''}
 </div>
 <div class="card">${list.length?`<p class="mut" style="margin:0 0 4px">Ketuk tombol Lunas untuk mencatat sisa iuran murid sekali ketuk. Ketuk namanya untuk cicilan atau bayar beberapa bulan.</p>`+list.map(({m,s})=>`<div class="item" style="cursor:default"><div class="grow" onclick="detailMurid('${m.id}')" style="cursor:pointer"><div>${esc(m.nama)}</div><div class="mut">${s.k==='ok'?'Terbayar '+rp(s.p):'Terbayar '+rp(s.p)+' dari '+rp(m.tarif)}</div></div>${s.k==='ok'?'<span class="badge b-ok">Lunas</span>':`<span class="badge b-${s.k}">${s.t}</span><button class="btn2" onclick="quickLunas('${m.id}')">Lunas</button>`}</div>`).join('')
  :`<div class="empty">Belum ada murid yang wajib iuran di bulan ini. Tambahkan murid di menu Murid, atau impor daftar namanya sekaligus.</div>`}</div>`;
}
function catatLunas(m,ym,tgl){
 const sisa=m.tarif-paidFor(m.id,ym);
 if(sisa<=0)return null;
 const rec={id:uid(),tipe:'masuk',tgl,kategori:IURAN,jumlah:sisa,ket:'Lunas',muridId:m.id,bulan:ym};
 db.trx.push(rec);return rec.id;
}
function quickLunas(id){
 const m=db.murid.find(x=>x.id===id);if(!m)return;
 const r=catatLunas(m,S.bulanIuran,S.tglTerima||today());
 if(!r)return;

function semuaLunas(){

 <textarea id="imp_txt" rows="7" placeholder="Aisyah, Tahfidz, 150000, 08123456789&#10;Zahra, Calistung, 120000&#10;Fatimah" oninput="prevImpor()"></textarea>
 <label>Iuran per bulan untuk baris yang tidak mencantumkan iuran (Rp)</label>

function bacaFileImpor(inp){
 const f=inp.files[0];if(!f)return;
 const r=new FileReader();r.onload=()=>{$('#imp_txt').value=String(r.result).replace(/^﻿/,'');prevImpor();};r.readAsText(f);inp.value='';
}
function parseImpor(){
 const dt=num($('#imp_tarif').value);
 const lines=$('#imp_txt').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 const ada=new Set(db.murid.map(m=>m.nama.trim().toLowerCase()));
 const baru=[],lewat=[];
 lines.forEach((ln,i)=>{
  const p=ln.split(/[\t;,]/).map(x=>x.trim());
  if(i===0&&/^nama/i.test(p[0]))return;
  const nama=p[0];if(!nama)return;
  if(ada.has(nama.toLowerCase())){lewat.push(nama);return;}
  ada.add(nama.toLowerCase());
  baru.push({nama,program:p[1]||'',tarif:num(p[2])||dt,hp:p[3]||''});
 });
 return {baru,lewat,dt};
}
function prevImpor(){
 const {baru,lewat}=parseImpor();
 $('#imp_prev').innerHTML=baru.length?`Akan ditambahkan <b>${baru.length}</b> murid.`+(lewat.length?` ${lewat.length} nama dilewati karena sudah ada.`:''):(lewat.length?'Semua nama sudah ada di daftar.':'Belum ada nama yang terbaca.');
}
function doImpor(){
 const {baru,dt}=parseImpor();
 if(!baru.length)return toast('Belum ada nama yang bisa diimpor');
 baru.forEach(b=>db.murid.push({id:uid(),nama:b.nama,program:b.program,tarif:b.tarif,hp:b.hp,mulai:thisMonth(),aktif:true}));
 db.tarifDefault=dt;save();closeSheet();render();toast(baru.length+' murid ditambahkan');
}

}

function openTrx(id,pre){

function syncF(){

 if(!g('f_tgl'))return;
 F.tgl=g('f_tgl').value;F.kategori=g('f_kat').value;F.jumlah=num(g('f_jml').value);F.ket=g('f_ket').value;

/* ---------- laporan ---------- */
function periodTrx(){return S.lapMode==='semua'?db.trx:db.trx.filter(t=>t.tgl.slice(0,7)===S.bulanLap);}
function saldoAwalPeriode(){
 if(S.lapMode==='semua')return db.saldoAwal;

 return db.saldoAwal+t.masuk-t.keluar;
}
function katBlock(g,cls){

}

  }
 }
 return `<div class="printonly"><h2 style="font-size:18pt">Laporan Keuangan ${esc(db.lembaga)}</h2><p>Periode: ${periode}</p></div>
 <div class="card noprint">

}
const NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
async function download(text,type,name){
 if(NATIVE){
  try{
   const FS=window.Capacitor.registerPlugin('Filesystem'),SH=window.Capacitor.registerPlugin('Share');
   const r=await FS.writeFile({path:name,data:text,directory:'CACHE',encoding:'utf8'});
   await SH.share({title:name,url:r.uri,dialogTitle:'Simpan atau kirim file'});
  }catch(e){const m=String((e&&e.message)||e);if(!/cancel/i.test(m))toast('Gagal membagikan file: '+m);}
  return;
 }
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
function cetakLaporan(){
 if(!NATIVE){window.print();return;}
 const css=document.querySelector('style').textContent;
 const isi=$('#app').innerHTML;
 const html='<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laporan Keuangan</title><style>'+css+'body{padding:12px}.noprint{display:none!important}.printonly{display:block}</style></head><body><main>'+isi+'</main></body></html>';
 download(html,'text/html;charset=utf-8','laporan-'+(S.lapMode==='semua'?'semua':S.bulanLap)+'.html');
}
function csv(){
 const list=periodTrx().slice().sort(cmpAsc);
 const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
 const rows=[['Tanggal','Jenis','Kategori','Murid','Bulan iuran','Keterangan','Jumlah'].map(q).join(',')];
 list.forEach(t=>rows.push([t.tgl,t.tipe==='masuk'?'Masuk':'Keluar',t.kategori,muridNama(t.muridId),t.bulan,t.ket,t.jumlah].map(q).join(',')));
 download('\ufeff'+rows.join('\r\n'),'text/csv;charset=utf-8','kas-'+(S.lapMode==='semua'?'semua':S.bulanLap)+'.csv');
}

/* ---------- pengaturan ---------- */
function vAtur(){
 const chips=(arr,j)=>arr.map((k,i)=>`<span class="chip">${esc(k)}${k===IURAN?'':` <b onclick="delKat('${j}',${i})">&times;</b>`}</span>`).join('');
 return `<div class="card"><h2>Data lembaga</h2>
  <label style="margin-top:0">Nama lembaga</label><input id="a_nama" value="${esc(db.lembaga)}" onchange="db.lembaga=this.value.trim()||'Rumah Belajar Maryam';save();render()">
  <label>Saldo awal kas (Rp)</label><input id="a_saldo" inputmode="numeric" value="${fmtNum(db.saldoAwal)}" oninput="fmtInput(this)" onchange="db.saldoAwal=num(this.value);save();toast('Tersimpan')">
  <p class="mut">Saldo awal adalah uang kas yang sudah ada sebelum Ibu mulai mencatat di aplikasi ini.</p>
 </div>
 <div class="card"><h2>Kategori uang masuk</h2>${chips(db.katMasuk,'masuk')}
  <div class="row" style="margin-top:8px"><input id="k_masuk" placeholder="Kategori baru"><button onclick="addKat('masuk')">Tambah</button></div></div>
 <div class="card"><h2>Kategori uang keluar</h2>${chips(db.katKeluar,'keluar')}
  <div class="row" style="margin-top:8px"><input id="k_keluar" placeholder="Kategori baru"><button onclick="addKat('keluar')">Tambah</button></div></div>
 <div class="card"><h2>Cadangan data</h2>
  <p class="mut">Data tersimpan di perangkat ini saja. Unduh cadangan secara berkala, lalu simpan filenya di Google Drive atau kirim ke WhatsApp sendiri.</p>
  <p class="mut">Cadangan terakhir: ${db.lastBackup?tglIndo(db.lastBackup.slice(0,10)):'belum pernah'}</p>
  <div style="display:grid;gap:8px"><button onclick="backup()">Unduh cadangan</button>
  <label class="btn btn2" style="text-align:center;margin:0">Pulihkan dari file cadangan<input type="file" accept=".json,application/json" style="display:none" onchange="restore(this)"></label></div>
 </div>
 <div class="card"><h2>Pasang aplikasi</h2>
  ${deferredInstall?'<button class="full" onclick="installApp()">Pasang di layar utama</button>':'<p class="mut">Di Chrome, buka menu titik tiga lalu pilih Tambahkan ke layar utama atau Pasang aplikasi. Kalau aplikasi dibuka dari ikon tersebut, tampilannya penuh seperti aplikasi biasa. Di Safari iPhone atau iPad, tekan tombol Bagikan lalu Tambahkan ke Layar Utama.</p>'}
 </div>
 <div class="card"><h2>Hapus semua data</h2><p class="mut">Gunakan hanya kalau benar-benar ingin mengulang dari awal.</p><button class="btnr full" onclick="wipe()">Hapus semua data</button></div>`;
}
function addKat(j){
 const el=$('#k_'+j),v=el.value.trim();if(!v)return;
 const arr=j==='masuk'?db.katMasuk:db.katKeluar;
 if(arr.some(x=>x.toLowerCase()===v.toLowerCase()))return toast('Kategori sudah ada');
 arr.push(v);save();render();
}
function delKat(j,i){
 const arr=j==='masuk'?db.katMasuk:db.katKeluar;
 if(!confirm('Hapus kategori "'+arr[i]+'"? Transaksi lama tetap aman.'))return;
 arr.splice(i,1);save();render();
}
function backup(){
 db.lastBackup=new Date().toISOString();save();
 download(JSON.stringify(db,null,1),'application/json','kas-rbm-'+today()+'.json');
 render();toast('Cadangan diunduh');
}
function restore(inp){
 const f=inp.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
  try{
   const d=JSON.parse(r.result);
   if(!Array.isArray(d.trx)||!Array.isArray(d.murid))throw 0;
   if(!confirm('Data yang ada sekarang akan diganti dengan isi file cadangan. Lanjutkan?'))return;
   db=Object.assign(clone(DEF),d);save();render();toast('Data berhasil dipulihkan');
  }catch(e){toast('File cadangan tidak dikenali');}
 };
 r.readAsText(f);inp.value='';
}
function wipe(){
 if(!confirm('Semua data murid dan transaksi akan dihapus. Lanjutkan?'))return;
 if(!confirm('Yakin? Data yang sudah dihapus tidak bisa dikembalikan kecuali ada file cadangan.'))return;
 db=clone(DEF);save();render();toast('Semua data dihapus');
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(S.tab==='atur')render();});
function installApp(){if(!deferredInstall)return;deferredInstall.prompt();deferredInstall.userChoice.finally(()=>{deferredInstall=null;render();});}

render();
</script>
</body>
</html>
