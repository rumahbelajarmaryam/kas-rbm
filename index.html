<title>Kas Rumah Belajar Maryam</title>
<style>
:root{--g:#0f766e;--g2:#14b8a6;--bg:#f4f7f6;--card:#fff;--tx:#1b2b29;--mut:#64748b;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--line:#e2e8f0}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:100px}
header.top{background:var(--g);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top))}
header.top h1{margin:0;font-size:19px}
.hrow{display:flex;gap:10px;align-items:center}
.sub{font-size:13px;opacity:.92;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbtn{background:rgba(255,255,255,.2);color:#fff;padding:8px 14px;border-radius:10px;font-size:15px;white-space:nowrap}
.hbtn[disabled]{opacity:.4}
.stat{display:inline-flex;gap:6px;align-items:center;font-size:13px;cursor:pointer;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:#86efac;display:inline-block}
.dot.p{background:#fde68a}.dot.o{background:#fca5a5}.dot.l{background:#cbd5e1}
main{max-width:720px;margin:0 auto;padding:14px}
h2{font-size:17px;margin:4px 0 10px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.big{font-size:28px;font-weight:700}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
input[type=date],input[type=month]{min-width:0;max-width:100%;padding:10px 6px;font-size:15px}
.mut{color:var(--mut);font-size:14px}
.badge{padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.b-ok{background:#dcfce7;color:var(--ok)}.b-warn{background:#fef3c7;color:var(--warn)}.b-bad{background:#fee2e2;color:var(--bad)}.b-off{background:#e2e8f0;color:#475569}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.in{color:var(--ok);font-weight:600;white-space:nowrap}.out{color:var(--bad);font-weight:600;white-space:nowrap}
button,.btn{font:inherit;border:0;border-radius:10px;padding:10px 16px;background:var(--g);color:#fff;font-weight:600;cursor:pointer}
.btn2{background:#e6f4f1;color:var(--g)}.btnr{background:#fee2e2;color:var(--bad)}.full{width:100%}
button[disabled]{cursor:default}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:var(--tx)}
input[type=checkbox]{width:auto}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:8px 2px;font-size:12px;font-weight:600}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--g)}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;font-size:30px;padding:0;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:6}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
#overlay.on{display:flex}
#sheet{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
#login{position:fixed;inset:0;background:var(--bg);z-index:40;overflow:auto;display:none}
#login.on{display:block}
.seg{display:flex;gap:8px;margin-bottom:6px}
.seg button{flex:1;background:#e2e8f0;color:#334155}
.seg button.on{background:var(--g);color:#fff}
.seg button.on.m{background:var(--ok)}.seg button.on.k{background:var(--bad)}
.bar{height:8px;background:#e2e8f0;border-radius:9px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--g2)}
.banner{background:#fef3c7;color:#78350f;border-radius:12px;padding:12px;margin-bottom:12px}
.err{background:#fee2e2;color:#7f1d1d;border-radius:10px;padding:10px 12px;margin:10px 0}
.chip{display:inline-flex;gap:8px;align-items:center;background:#e6f4f1;color:var(--g);padding:4px 12px;border-radius:99px;margin:3px;font-size:14px}
.chip b{cursor:pointer;color:var(--bad)}
.empty{text-align:center;color:var(--mut);padding:18px 8px}

/* ---------- pembantu ---------- */
const clone=o=>JSON.parse(JSON.stringify(o));
const $=s=>document.querySelector(s);
const rp=n=>(n<0?'-':'')+'Rp'+new Intl.NumberFormat('id-ID').format(Math.abs(Math.round(n||0)));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const thisMonth=()=>today().slice(0,7);
const namaBulan=ym=>{const [y,m]=ym.split('-');return BULAN[+m-1]+' '+y;};
const tglIndo=s=>{const [y,m,d]=s.split('-');return (+d)+' '+BULAN[+m-1].slice(0,3)+' '+y;};
const jam=ms=>new Date(ms).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
const jamTgl=ms=>{const d=new Date(ms);return d.getDate()+' '+BULAN[d.getMonth()].slice(0,3)+' '+jam(ms);};
const num=v=>+(String(v==null?'':v).replace(/\D/g,''))||0;
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
const fmtNum=n=>n?new Intl.NumberFormat('id-ID').format(n):'';
const labelPeran=p=>({admin:'Admin',pengisi:'Pengisi',guru:'Guru',pelihat:'Hanya melihat'}[p]||p);

/* ---------- data: setiap catatan punya id, waktu ubah (upd), dan tanda hapus (del) ---------- */
const emptyDB=()=>({v:2,recs:{murid:{},guru:{},trx:{},set:{},cat:{}},dirty:{},hist:[],logQ:[],cur:0,sid:'',lastSync:0,lastBackup:''});
let DB=loadDB();
let ver=0,_ix=null,curBatch=null;
function touch(){ver++;_ix=null;}
function loadDB(){
 try{
  const d=JSON.parse(lsGet(KEY));
  if(d&&d.v===2&&d.recs){const x=Object.assign(emptyDB(),d);KOLEKSI.forEach(k=>{x.recs[k]=x.recs[k]||{};});return x;}
 }catch(e){}
 try{
  const o=JSON.parse(lsGet(KEY_OLD));
  if(o&&Array.isArray(o.trx)){const x=emptyDB();x.lastBackup=o.lastBackup||'';adoptRecs(x,toRecs(o),true);return x;}
 }catch(e){}
 return emptyDB();
}
function persist(){if(!lsSet(KEY,JSON.stringify(DB)))toast('Penyimpanan perangkat penuh, data belum tersimpan');}
function nextUpd(before){return Math.max(Date.now(),(before?before.upd:0)+1);}
function adoptRecs(target,recs,markDirty){
 let n=0;
 KOLEKSI.forEach(c=>{(recs[c]||[]).forEach(r=>{
  if(!r||!r.id)return;
  const cur=target.recs[c][r.id];
  target.recs[c][r.id]=Object.assign({},r,{del:0,upd:Math.max(Date.now(),(cur?cur.upd:0)+1)+n});
  if(markDirty)target.dirty[c+':'+r.id]=1;
  n++;
 });});
 return n;
}
function toRecs(d){
 if(d&&d.v===2&&d.recs)return d.recs;
 if(d&&Array.isArray(d.trx)&&Array.isArray(d.murid)){
  const s={id:'main',lembaga:d.lembaga,saldoAwal:d.saldoAwal||0,katMasuk:d.katMasuk,katKeluar:d.katKeluar,tarifDefault:d.tarifDefault||0};
  Object.keys(s).forEach(k=>{if(s[k]===undefined)delete s[k];});
  return {murid:d.murid,guru:d.guru||[],trx:d.trx,set:[s]};
 }
 return null;
}
const live=c=>Object.values(DB.recs[c]).filter(r=>!r.del);
const getRec=(c,id)=>{const r=DB.recs[c][id];return r&&!r.del?r:null;};
function SET(){
 const r=DB.recs.set.main;const s=Object.assign(clone(DEFSET),r&&!r.del?r:{});
 if(!s.katKeluar.includes(HONOR))s.katKeluar.unshift(HONOR);
 if(!s.katMasuk.includes(IURAN))s.katMasuk.unshift(IURAN);
 return s;
}
function ix(){
 if(_ix)return _ix;
 const o={iuran:{},honor:{},trx:[]};
 for(const t of Object.values(DB.recs.trx)){
  if(t.del)continue;
  o.trx.push(t);
  if(t.tipe==='masuk'&&t.kategori===IURAN&&t.muridId){const k=t.muridId+'|'+t.bulan;o.iuran[k]=(o.iuran[k]||0)+t.jumlah;}
  if(t.tipe==='keluar'&&t.kategori===HONOR&&t.guruId){const k=t.guruId+'|'+t.bulan;o.honor[k]=(o.honor[k]||0)+t.jumlah;}
 }
 return (_ix=o);
}
function putRec(c,obj){
 const id=obj.id||uid();
 const before=DB.recs[c][id]?clone(DB.recs[c][id]):null;
 const rec=Object.assign({},before||{},obj,{id,upd:nextUpd(before),del:0});
 DB.recs[c][id]=rec;DB.dirty[c+':'+id]=1;touch();
 if(curBatch)curBatch.push({k:c,id,b:before,a:clone(rec)});
 return rec;
}
function delRec(c,id){
 const before=DB.recs[c][id];if(!before||before.del)return;
 const rec=Object.assign({},before,{del:1,upd:nextUpd(before)});
 DB.recs[c][id]=rec;DB.dirty[c+':'+id]=1;touch();
 if(curBatch)curBatch.push({k:c,id,b:clone(before),a:clone(rec)});
}
function putRaw(c,id,rec){
 const cur=DB.recs[c][id];
 const r=Object.assign({},rec,{upd:nextUpd(cur)});
 DB.recs[c][id]=r;DB.dirty[c+':'+id]=1;touch();
}

let SES=null;
try{SES=JSON.parse(lsGet(KEY_SES));}catch(e){}
function peran(){return ONLINE?(SES?SES.peran:''):'admin';}
function can(a){const p=peran();if(a==='admin')return p==='admin';if(a==='tulis')return p==='admin'||p==='pengisi';if(a==='catat')return p==='admin'||p==='pengisi'||p==='guru';return !!p;}
function deny(){toast('Akun ini hanya bisa melihat data');return false;}

/* ---------- riwayat dan batalkan ---------- */
function act(label,fn){
 if(!can('tulis')&&!can('catat'))return deny();
 const ops=[];curBatch=ops;let err=null;
 try{fn();}catch(e){err=e;}finally{curBatch=null;}
 if(err){console.error(err);toast('Gagal: '+err.message);return false;}
 if(!ops.length)return false;
 DB.hist.push({id:uid(),t:Date.now(),x:label,ops});
 for(let i=DB.hist.length-1,n=0;i>=0;i--){
  n+=DB.hist[i].ops.length;
  if((n>800||DB.hist.length-i>80)&&i<DB.hist.length-1){DB.hist.splice(0,i+1);break;}
 }
 DB.logQ.push({t:Date.now(),x:label});
 if(DB.logQ.length>300)DB.logQ.splice(0,DB.logQ.length-300);
 persist();scheduleSync();
 return true;
}
function done(label,fn,msg){
 if(act(label,fn)){closeSheet();render();toastUndo(msg||label);return true;}
 return false;
}
function undoLast(){const h=DB.hist[DB.hist.length-1];if(h)undoEntry(h.id);}
function undoEntry(id){
 if(!can('tulis')&&!can('catat'))return deny();
 const i=DB.hist.findIndex(h=>h.id===id);const h=DB.hist[i];if(!h)return;
 const berubah=h.ops.some(o=>{const c=DB.recs[o.k][o.id];return c&&o.a&&c.upd!==o.a.upd;});
 if(berubah&&!confirm('Data ini sudah diubah lagi setelah kegiatan itu (mungkin oleh orang lain). Tetap kembalikan ke keadaan sebelumnya?'))return;
 for(const o of h.ops.slice().reverse()){
  const cur=DB.recs[o.k][o.id];
  if(o.b===null){if(cur&&!cur.del)delRec(o.k,o.id);}
  else putRaw(o.k,o.id,o.b);
 }
 DB.hist.splice(i,1);
 DB.logQ.push({t:Date.now(),x:'Membatalkan: '+h.x});
 persist();scheduleSync();closeSheet();render();toast('Dibatalkan: '+h.x,3500);
}
function updUndo(){
 const h=DB.hist[DB.hist.length-1];
 const b=$('#btnUndo');if(!b)return;
 b.disabled=!h||(!can('tulis')&&!can('catat'));
 b.title=h?'Batalkan: '+h.x:'';
 $('#lastAct').textContent=h?'Terakhir: '+h.x:'';
}

/* ---------- server: masuk dan sinkron ---------- */
let SYNC={st:'ok',err:''},syncing=false,again=false,syncT=null,retryT=null;
let LG={mode:'masuk',butuhSetup:false,pesan:'',sibuk:false,cek:false,user:lsGet(KEY_USER)||''};
function pesanGalat(e){
 if(e&&e.pesan)return e.pesan;
 if(e&&e.name==='AbortError')return 'Server tidak menjawab. Coba lagi sebentar.';
 return 'Tidak bisa tersambung ke server. Periksa sinyal internet.';
}
async function api(aksi,data,tanpaToken){
 const ctl=typeof AbortController!=='undefined'?new AbortController():null;
 const to=ctl?setTimeout(()=>ctl.abort(),40000):null;
 let r;
 try{
  r=await fetch(SERVER_URL,{method:'POST',body:JSON.stringify(Object.assign({aksi,token:(!tanpaToken&&SES)?SES.token:''},data||{})),signal:ctl?ctl.signal:undefined,redirect:'follow'});
 }finally{if(to)clearTimeout(to);}
 const teks=await r.text();let j;
 try{j=JSON.parse(teks);}catch(e){throw {kode:'FORMAT',pesan:'Jawaban server tidak dikenali. Coba lagi sebentar.'};}
 if(!j.ok)throw {kode:j.kode,pesan:j.pesan,pengguna:j.pengguna};
 return j;
}
function setSes(r){
 SES={token:r.token,u:r.pengguna.username,nama:r.pengguna.nama,peran:r.pengguna.peran};
 lsSet(KEY_SES,JSON.stringify(SES));lsSet(KEY_USER,SES.u);
}
function purgeDirty(){
 if(!ONLINE||!SES)return;
 const ok=ALLOW[SES.peran]||[];
 for(const k of Object.keys(DB.dirty)){if(!ok.includes(k.slice(0,k.indexOf(':'))))delete DB.dirty[k];}
}
function applyRemote(k,r){
 if(!DB.recs[k]||!r||!r.id)return false;
 const cur=DB.recs[k][r.id];
 if(cur&&cur.upd>=r.upd)return false;
 DB.recs[k][r.id]=r;delete DB.dirty[k+':'+r.id];
 return true;
}
function scheduleSync(ms){
 if(!ONLINE||!SES)return;
 clearTimeout(syncT);syncT=setTimeout(()=>syncNow(),ms==null?1500:ms);updStat();
}
async function syncNow(manual){
 if(!ONLINE||!SES)return;
 if(syncing){again=true;return;}
 if(typeof navigator!=='undefined'&&navigator.onLine===false){SYNC.st='offline';updStat();return;}
 syncing=true;SYNC.st='proses';updStat();clearTimeout(retryT);
 try{
  purgeDirty();
  const items=[];
  for(const k of Object.keys(DB.dirty)){
   const i=k.indexOf(':'),c=k.slice(0,i),id=k.slice(i+1);
   const r=DB.recs[c]&&DB.recs[c][id];
   if(r)items.push({k:c,r:clone(r)});else delete DB.dirty[k];
  }
  const logq=DB.logQ.slice();
  let res;const CH=300;
  for(let i=0;i<items.length;i+=CH){
   const last=i+CH>=items.length;
   res=await api('sinkron',{kursor:DB.cur,kirim:items.slice(i,i+CH),log:last?logq:[],tarik:last});
  }
  if(!items.length)res=await api('sinkron',{kursor:DB.cur,kirim:[],log:logq,tarik:true});
  if(DB.sid&&res.sid&&DB.sid!==res.sid){
   DB.sid=res.sid;DB.cur=0;
   KOLEKSI.forEach(c=>Object.keys(DB.recs[c]).forEach(id=>{DB.dirty[c+':'+id]=1;}));
   persist();syncing=false;scheduleSync(200);return;
  }
  DB.sid=res.sid||DB.sid;
  let changed=0;const rem=new Set();
  for(const x of (res.rekaman||[])){if(applyRemote(x.k,x.r)){changed++;rem.add(x.k+':'+x.r.id);}}
  for(const it of items){
   const key=it.k+':'+it.r.id,cur=DB.recs[it.k][it.r.id];
   if(!cur||cur.upd===it.r.upd||rem.has(key))delete DB.dirty[key];
  }
  DB.logQ.splice(0,logq.length);
  DB.cur=res.srv;DB.lastSync=Date.now();
  if(res.pengguna&&(res.pengguna.peran!==SES.peran||res.pengguna.nama!==SES.nama)){SES.peran=res.pengguna.peran;SES.nama=res.pengguna.nama;lsSet(KEY_SES,JSON.stringify(SES));}
  SYNC.st='ok';SYNC.err='';persist();
  if(changed){touch();softRender();}else{updStat();updUndo();}
 }catch(e){
  if(e&&e.kode==='AUTH'){
   SES=null;lsDel(KEY_SES);LG.pesan='Sesi berakhir. Silakan masuk lagi.';LG.cek=false;render();
  }else if(e&&e.kode==='IZIN'){
   if(e.pengguna&&SES){SES.peran=e.pengguna.peran;lsSet(KEY_SES,JSON.stringify(SES));}
   purgeDirty();persist();SYNC.st='gagal';SYNC.err=e.pesan;toast(e.pesan);softRender();
  }else{
   SYNC.st=(typeof navigator!=='undefined'&&navigator.onLine===false)?'offline':'gagal';
   SYNC.err=pesanGalat(e);if(manual)toast(SYNC.err);
   retryT=setTimeout(()=>syncNow(),30000);
  }
  updStat();
 }finally{
  syncing=false;
  if(again){again=false;scheduleSync(300);}
 }
}
function softRender(){
 const a=document.activeElement;
 const mengetik=a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)&&$('#app').contains(a);
 if(sheetOpen()||mengetik){updStat();updUndo();return;}
 render();
}
function updStat(){
 const e=$('#stat');if(!e)return;
 if(!ONLINE){e.innerHTML='<span class="dot l"></span>Tersimpan di perangkat ini';return;}
 const n=Object.keys(DB.dirty).length;let c='',t='';
 if(SYNC.st==='proses'){c='p';t='Menyimpan...';}
 else if(SYNC.st==='offline'){c='o';t='Belum ada sinyal'+(n?', '+n+' menunggu':'');}
 else if(SYNC.st==='gagal'){c='o';t='Belum tersambung, ketuk untuk coba lagi';}
 else if(n){c='p';t=n+' menunggu dikirim';}
 else t='Tersimpan di server'+(DB.lastSync?' '+jam(DB.lastSync):'');
 e.innerHTML='<span class="dot '+c+'"></span>'+esc(t);
}

async function doLogin(){
 const u=$('#l_u').value.trim().toLowerCase(),p=$('#l_p').value;
 LG.user=u;
 if(!u||!p){LG.pesan='Isi nama pengguna dan kata sandi.';return drawLogin();}
 LG.sibuk=true;LG.pesan='';drawLogin();
 try{const r=await api('masuk',{username:u,sandi:p},true);setSes(r);await afterLogin();}
 catch(e){LG.pesan=pesanGalat(e);LG.sibuk=false;drawLogin();}
}
async function doSetup(){
 const g=id=>$('#'+id).value;
 if(g('s_p')!==g('s_p2')){LG.pesan='Kata sandi dan pengulangannya tidak sama.';return drawLogin();}

 drawLogin();
 try{
  const r=await api('setup',{kode:keep.k,nama:keep.n,username:keep.u,sandi:keep.p},true);

 }catch(e){LG.pesan=pesanGalat(e);LG.sibuk=false;drawLogin();

}

 LG.sibuk=false;LG.pesan='';LG.mode='masuk';
 purgeDirty();persist();render();syncNow(true);
}

/* ---------- pembantu hitung ---------- */
const muridAll=()=>live('murid'),guruAll=()=>live('guru');
const muridNama=id=>{const m=DB.recs.murid[id];return m?m.nama:'';};
const guruNama=id=>{const g=DB.recs.guru[id];return g?g.nama:'';};
const paidFor=(id,ym)=>ix().iuran[id+'|'+ym]||0;
const paidGuru=(id,ym)=>ix().honor[id+'|'+ym]||0;
function totals(list){return {masuk:sum(list.filter(t=>t.tipe==='masuk'),t=>t.jumlah),keluar:sum(list.filter(t=>t.tipe==='keluar'),t=>t.jumlah)};}
function wajib(m,ym){return (m.mulai||'0000-00')<=ym&&(m.aktif?true:ym<(m.berhenti||'0000-00'));}
function statusIuran(m,ym){
 const p=paidFor(m.id,ym);
 if(p>=m.tarif)return {k:'ok',t:'Lunas',p};
 if(p>0)return {k:'warn',t:'Sebagian',p};
 return {k:'bad',t:'Belum',p};
}
function statusGaji(g,ym){
 const p=paidGuru(g.id,ym);
 if(g.honor>0&&p>=g.honor)return {k:'ok',t:'Sudah',p};
 if(p>0)return {k:'warn',t:'Sebagian',p};
 return {k:'bad',t:'Belum',p};
}
const cmpDesc=(a,b)=>b.tgl.localeCompare(a.tgl)||b.id.localeCompare(a.id);
const cmpAsc=(a,b)=>a.tgl.localeCompare(b.tgl)||a.id.localeCompare(b.id);
function group(list){const o={};list.forEach(t=>o[t.kategori]=(o[t.kategori]||0)+t.jumlah);return Object.entries(o).sort((a,b)=>b[1]-a[1]);}

 const ord={bad:0,warn:1,ok:2};
 list.sort((a,b)=>ord[a.s.k]-ord[b.s.k]||a.m.nama.localeCompare(b.m.nama));
 const bayar=list.filter(x=>x.m.tarif>0);
 const target=sum(bayar,x=>x.m.tarif),kumpul=sum(bayar,x=>Math.min(x.s.p,x.m.tarif));
 const lunas=bayar.filter(x=>x.s.k==='ok').length,belum=bayar.length-lunas,subs=list.length-bayar.length;
 return `<div class="card"><div class="grid2"><div><label style="margin-top:0">Bulan iuran</label>
  <input type="month" value="${ym}" onchange="S.bulanIuran=this.value||thisMonth();render()"></div>
  ${W?`<div><label style="margin-top:0">Tanggal diterima</label><input type="date" value="${S.tglTerima}" onchange="S.tglTerima=this.value||today()"></div>`:'<div></div>'}</div>

function waLink(m,ym){

function bacaFile(inp,target,after){
 const f=inp.files[0];if(!f)return;

}
function splitRow(ln){return ln.split(/[\t;,]/).map(x=>x.trim());}
function parseGuru(){
 const ada=new Set(guruAll().map(g=>g.nama.trim().toLowerCase()));
 const out=[],lewat=[];
 $('#g_txt').value.split(/\r?\n/).map(x=>x.trim()).filter(x=>x.replace(/[\t;,\s]/g,'')).forEach((ln,i)=>{
  const p=splitRow(ln);
  if(i===0&&/^nama/i.test(p[0]))return;
  const nama=p[0];if(!nama)return;
  if(ada.has(nama.toLowerCase())){lewat.push(nama);return;}
  ada.add(nama.toLowerCase());out.push({nama,honor:num(p[1])});
 });
 return {out,lewat};
}

 openSheet(`<h2>Impor daftar murid</h2>
 <p class="mut" style="margin-top:-6px">Pilih file CSV atau tempel dari Excel. Kalau baris pertama berisi judul kolom (Nama, GENDER, KELAS, Program, Iuran per bulan, dan seterusnya), aplikasi membacanya otomatis. Tanpa judul, urutannya: Nama, Program, Iuran, WhatsApp wali. Yang wajib hanya nama. Iuran 0 dianggap murid subsidi.</p>
 <label class="btn btn2" style="text-align:center;margin:0 0 8px;display:block">Pilih file CSV atau teks<input type="file" accept=".csv,.txt,text/csv,text/plain" style="display:none" onchange="bacaFile(this,'imp_txt',prevImpor)"></label>
 <textarea id="imp_txt" rows="7" placeholder="Aisyah,P,2,BIMBEL,150000&#10;Alif,L,7,MENGAJI,30000" oninput="prevImpor()"></textarea>
 <label>Iuran per bulan untuk baris yang tidak mencantumkan iuran (Rp)</label>
 <input id="imp_tarif" inputmode="numeric" value="${fmtNum(SET().tarifDefault||0)}" oninput="fmtInput(this);prevImpor()">
 <p id="imp_prev" class="mut" style="margin:10px 0"></p>
 <div style="display:grid;gap:8px"><button onclick="doImpor()">Impor</button><button class="btn2" onclick="unduhContoh()">Unduh file contoh</button><button class="btn2" onclick="closeSheet()">Batal</button></div>`);
 prevImpor();
}
function parseImpor(){
 const dt=num($('#imp_tarif').value);
 const lines=$('#imp_txt').value.split(/\r?\n/).map(x=>x.trim()).filter(x=>x.replace(/[\t;,\s]/g,''));
 const ada=new Set(muridAll().map(m=>m.nama.trim().toLowerCase()));
 const baru=[],lewat=[];
 let kol=null,start=0;
 if(lines.length&&/^nama/i.test(splitRow(lines[0])[0])){
  kol={};
  splitRow(lines[0]).forEach((h,i)=>{
   const k=h.toLowerCase();
   if(/^nama/.test(k))kol.nama=i;
   else if(/gender|jenis|^jk$|kelamin/.test(k))kol.gender=i;
   else if(/kelas/.test(k))kol.kelas=i;
   else if(/program/.test(k))kol.program=i;
   else if(/iuran|tarif|spp/.test(k))kol.tarif=i;
   else if(/wa|hp|telp|whatsapp/.test(k))kol.hp=i;
   else if((/ket/.test(k)||k==='')&&kol.ket==null)kol.ket=i;
  });
  start=1;
 }
 lines.slice(start).forEach(ln=>{
  const p=splitRow(ln);let r;
  if(kol){const g=k=>kol[k]==null?'':(p[kol[k]]||'');r={nama:g('nama'),gender:g('gender').toUpperCase().slice(0,1),kelas:g('kelas'),program:g('program'),tarifTxt:g('tarif'),hp:g('hp'),ket:g('ket')};}
  else r={nama:p[0]||'',gender:'',kelas:'',program:p[1]||'',tarifTxt:p[2]||'',hp:p[3]||'',ket:''};
  if(!r.nama)return;
  if(ada.has(r.nama.toLowerCase())){lewat.push(r.nama);return;}
  ada.add(r.nama.toLowerCase());
  baru.push({nama:r.nama,gender:(r.gender==='L'||r.gender==='P')?r.gender:'',kelas:r.kelas,program:r.program,tarif:r.tarifTxt!==''?num(r.tarifTxt):dt,hp:r.hp,ket:r.ket});
 });
 return {baru,lewat,dt};
}
function prevImpor(){
 const {baru,lewat}=parseImpor();
 $('#imp_prev').innerHTML=baru.length?`Akan ditambahkan <b>${baru.length}</b> murid.`+(lewat.length?` ${lewat.length} nama dilewati karena sudah ada.`:''):(lewat.length?'Semua nama sudah ada di daftar.':'Belum ada nama yang terbaca.');
}
function doImpor(){
 const {baru,dt}=parseImpor();
 if(!baru.length)return toast('Belum ada nama yang bisa diimpor');
 done('Mengimpor '+baru.length+' murid',()=>{
  baru.forEach(b=>putRec('murid',{nama:b.nama,gender:b.gender,kelas:b.kelas,program:b.program,tarif:b.tarif,ket:b.ket,hp:b.hp,mulai:thisMonth(),aktif:true}));
  if(can('admin')&&dt!==SET().tarifDefault)putRec('set',Object.assign({id:'main'},SET(),{tarifDefault:dt}));
 },baru.length+' murid ditambahkan');
}
function unduhContoh(){
 download('﻿'+['Nama,GENDER,KELAS,Program,Iuran per bulan,Keterangan','Aisyah,P,2,BIMBEL,150000,','Alif,L,7,MENGAJI,30000,','Ibrahim,L,4,BIMBEL,0,SUBSIDI'].join('\r\n'),'text/csv;charset=utf-8','daftar-murid-contoh.csv');
}

/* ---------- transaksi ---------- */
let F={};
function openTrx(id,pre){
 if(!can('tulis'))return deny();
 const t=id?getRec('trx',id):null;
 if(id&&!t)return;
 F=t?Object.assign({},t):Object.assign({id:'',tipe:'masuk',tgl:today(),kategori:IURAN,jumlah:0,ket:'',muridId:'',guruId:'',bulan:thisMonth()},pre||{});
 drawTrx();
}
function syncF(){
 const g=i=>document.getElementById(i);
 if(!g('f_tgl'))return;
 F.tgl=g('f_tgl').value;F.kategori=g('f_kat').value;F.jumlah=num(g('f_jml').value);F.ket=g('f_ket').value;
 if(g('f_murid')){F.muridId=g('f_murid').value;F.bulan=g('f_bln').value||thisMonth();}
 if(g('f_guru')){F.guruId=g('f_guru').value;F.bulan=g('f_gbln').value||thisMonth();}
}
const katKel=()=>SET().katKeluar.filter(k=>can('admin')||k!==HONOR);
function setTipe(t){syncF();F.tipe=t;F.kategori=(t==='masuk'?SET().katMasuk:katKel())[0];drawTrx();}
function onKat(){syncF();drawTrx();}
function onMurid(){
 syncF();
 const m=getRec('murid',F.muridId);
 if(m&&!F.id)F.jumlah=Math.max(0,m.tarif-paidFor(m.id,F.bulan))||m.tarif;
 drawTrx();
}
function onGuru(){
 syncF();
 const g=getRec('guru',F.guruId);
 if(g&&!F.id)F.jumlah=Math.max(0,g.honor-paidGuru(g.id,F.bulan))||g.honor||0;
 drawTrx();
}
function drawTrx(){
 let kats=(F.tipe==='masuk'?SET().katMasuk:katKel()).slice();
 if(!kats.includes(F.kategori))kats.push(F.kategori);
 const iur=F.tipe==='masuk'&&F.kategori===IURAN,hon=F.tipe==='keluar'&&F.kategori===HONOR;
 const murid=muridAll().filter(m=>m.aktif||m.id===F.muridId).sort((a,b)=>a.nama.localeCompare(b.nama));
 const guruL=guruAll().filter(g=>g.aktif!==false||g.id===F.guruId).sort((a,b)=>a.nama.localeCompare(b.nama));
 openSheet(`<h2>${F.id?'Ubah transaksi':'Catat transaksi'}</h2>
 <div class="seg"><button class="${F.tipe==='masuk'?'on m':''}" onclick="setTipe('masuk')">Uang masuk</button><button class="${F.tipe==='keluar'?'on k':''}" onclick="setTipe('keluar')">Uang keluar</button></div>
 <label>Tanggal</label><input type="date" id="f_tgl" value="${F.tgl}">
 <label>Kategori</label><select id="f_kat" onchange="onKat()">${kats.map(k=>`<option ${k===F.kategori?'selected':''}>${esc(k)}</option>`).join('')}</select>
 ${iur?`<label>Nama murid</label><select id="f_murid" onchange="onMurid()"><option value="">Pilih murid</option>${murid.map(m=>`<option value="${m.id}" ${m.id===F.muridId?'selected':''}>${esc(m.nama)}</option>`).join('')}</select>
 <label>Untuk iuran bulan</label><input type="month" id="f_bln" value="${F.bulan||thisMonth()}" onchange="onMurid()">`:''}
 ${hon?`<label>Nama guru</label><select id="f_guru" onchange="onGuru()"><option value="">Pilih guru</option>${guruL.map(g=>`<option value="${g.id}" ${g.id===F.guruId?'selected':''}>${esc(g.nama)}</option>`).join('')}</select>
 <label>Untuk honor bulan</label><input type="month" id="f_gbln" value="${F.bulan||thisMonth()}" onchange="onGuru()">`:''}
 <label>Jumlah (Rp)</label><input id="f_jml" inputmode="numeric" value="${fmtNum(F.jumlah)}" oninput="fmtInput(this)">
 <label>Keterangan (boleh dikosongkan)</label><input id="f_ket" value="${esc(F.ket)}" placeholder="Contoh: transfer, tunai, beli spidol">
 <div style="display:grid;gap:8px;margin-top:14px">
  <button onclick="saveTrx()">Simpan</button>
  ${F.id?`<button class="btnr" onclick="delTrx('${F.id}')">Hapus transaksi</button>`:''}
  <button class="btn2" onclick="closeSheet()">Batal</button>
 </div>`);
}
function saveTrx(){
 syncF();
 if(!F.tgl)return toast('Tanggal belum diisi');
 if(F.jumlah<=0)return toast('Jumlah belum diisi');
 const iur=F.tipe==='masuk'&&F.kategori===IURAN,hon=F.tipe==='keluar'&&F.kategori===HONOR;
 if(iur&&!F.muridId)return toast('Pilih nama murid dulu');
 if(hon&&!F.guruId)return toast('Pilih nama guru dulu');
 const rec={tipe:F.tipe,tgl:F.tgl,kategori:F.kategori,jumlah:F.jumlah,ket:(F.ket||'').trim(),muridId:iur?F.muridId:'',guruId:hon?F.guruId:'',bulan:(iur||hon)?F.bulan:''};
 if(F.id)rec.id=F.id;
 const nm=iur?muridNama(F.muridId):(hon?guruNama(F.guruId):'');
 const label=(F.id?'Mengubah ':'Mencatat ')+(F.tipe==='masuk'?'uang masuk ':'uang keluar ')+F.kategori+(nm?' '+nm:'')+' '+rp(F.jumlah);
 done(label,()=>putRec('trx',rec),'Tersimpan');
}
function delTrx(id){
 const t=getRec('trx',id);if(!t)return;
 done('Menghapus catatan '+t.kategori+' '+rp(t.jumlah),()=>delRec('trx',id),'Catatan dihapus');
}

/* ---------- laporan ---------- */
function periodTrx(){return S.lapMode==='semua'?ix().trx:ix().trx.filter(t=>t.tgl.slice(0,7)===S.bulanLap);}
function saldoAwalPeriode(){
 if(S.lapMode==='semua')return SET().saldoAwal;
 const t=totals(ix().trx.filter(x=>x.tgl.slice(0,7)<S.bulanLap));
 return SET().saldoAwal+t.masuk-t.keluar;
}
function katBlock(g,cls){
 if(!g.length)return '<p class="mut">Tidak ada.</p>';
 const mx=g[0][1]||1;
 return g.map(([k,v])=>`<div style="margin:8px 0"><div class="row"><div class="grow">${esc(k)}</div><div class="${cls}">${rp(v)}</div></div><div class="bar"><i style="width:${Math.round(v/mx*100)}%"></i></div></div>`).join('');
}
function vLaporan(){
 const mode=S.lapMode,ym=S.bulanLap;
 const list=periodTrx().slice().sort(cmpAsc);
 const tot=totals(list),awal=saldoAwalPeriode(),akhir=awal+tot.masuk-tot.keluar,selisih=tot.masuk-tot.keluar;
 const periode=mode==='semua'?'seluruh periode pencatatan':namaBulan(ym);
 const gm=group(list.filter(t=>t.tipe==='masuk')),gk=group(list.filter(t=>t.tipe==='keluar'));
 let iuranHtml='',honorHtml='';
 if(mode==='bulan'){
  const wm=muridAll().filter(m=>wajib(m,ym)).sort((a,b)=>a.nama.localeCompare(b.nama));
  if(wm.length){
   const wb=wm.filter(m=>m.tarif>0),lunas=wb.filter(m=>paidFor(m.id,ym)>=m.tarif).length;
   iuranHtml=`<div class="card"><h2>Status iuran murid</h2><p>Dari ${wb.length} murid yang membayar, ${lunas} sudah lunas pada ${namaBulan(ym)}.${wm.length>wb.length?' Ada '+(wm.length-wb.length)+' murid subsidi yang tidak membayar iuran.':''}</p>
   <table><tr><th>Nama</th><th class="r">Iuran</th><th class="r">Terbayar</th><th class="r">Sisa</th></tr>
   ${wm.map(m=>{const p=paidFor(m.id,ym);return `<tr><td>${esc(m.nama)}</td><td class="r">${rp(m.tarif)}</td><td class="r">${rp(p)}</td><td class="r">${rp(Math.max(0,m.tarif-p))}</td></tr>`;}).join('')}</table></div>`;
  }
  if(guruAll().length){
   const gl=guruAll().filter(g=>g.aktif!==false||paidGuru(g.id,ym)>0).sort((a,b)=>a.nama.localeCompare(b.nama));
   const sudah=gl.filter(g=>statusGaji(g,ym).k==='ok').length;
   honorHtml=`<div class="card"><h2>Honor guru</h2><p>Pada ${namaBulan(ym)}, ${sudah} dari ${gl.length} guru sudah menerima honor, dengan total pengeluaran ${rp(sum(gl,g=>paidGuru(g.id,ym)))}.</p>
   <table><tr><th>Nama</th><th class="r">Honor</th><th class="r">Dibayar</th></tr>${gl.map(g=>`<tr><td>${esc(g.nama)}</td><td class="r">${g.honor?rp(g.honor):'-'}</td><td class="r">${rp(paidGuru(g.id,ym))}</td></tr>`).join('')}</table></div>`;
  }
 }
 return `<div class="printonly"><h2 style="font-size:18pt">Laporan Keuangan ${esc(SET().lembaga)}</h2><p>Periode: ${periode}</p></div>
 <div class="card noprint">
  <div class="seg"><button class="${mode==='bulan'?'on':''}" onclick="S.lapMode='bulan';render()">Per bulan</button><button class="${mode==='semua'?'on':''}" onclick="S.lapMode='semua';render()">Semua waktu</button></div>
  ${mode==='bulan'?`<input type="month" value="${ym}" onchange="S.bulanLap=this.value||thisMonth();render()">`:''}
  <div class="grid2" style="margin-top:10px"><button onclick="cetakLaporan()">${NATIVE?'Bagikan laporan (untuk dicetak)':'Cetak atau simpan PDF'}</button><button class="btn2" onclick="csv()">Unduh Excel (CSV)</button></div>
 </div>
 <div class="card"><h2>Ringkasan ${mode==='semua'?'keseluruhan':namaBulan(ym)}</h2>
  <p>Pada ${periode}, ${esc(SET().lembaga)} menerima kas sebesar <b>${rp(tot.masuk)}</b> dan mengeluarkan <b>${rp(tot.keluar)}</b>. ${selisih>=0?'Ada kelebihan kas sebesar':'Kas berkurang sebesar'} ${rp(Math.abs(selisih))}, sehingga saldo akhir menjadi <b>${rp(akhir)}</b>.</p>
  <table><tr><td>Saldo awal</td><td class="r">${rp(awal)}</td></tr><tr><td>Uang masuk</td><td class="r in">${rp(tot.masuk)}</td></tr><tr><td>Uang keluar</td><td class="r out">${rp(tot.keluar)}</td></tr><tr><td><b>Saldo akhir</b></td><td class="r"><b>${rp(akhir)}</b></td></tr></table>
 </div>
 <div class="card"><h2>Uang masuk per kategori</h2>${katBlock(gm,'in')}</div>
 <div class="card"><h2>Uang keluar per kategori</h2>${katBlock(gk,'out')}</div>
 ${iuranHtml}${honorHtml}
 <div class="card"><h2>Daftar transaksi</h2>${list.length?list.slice().sort(cmpDesc).map(trxRow).join(''):'<div class="empty">Belum ada transaksi pada periode ini.</div>'}</div>`;
}
async function download(text,type,name){
 if(NATIVE){
  try{
   const FS=window.Capacitor.registerPlugin('Filesystem'),SH=window.Capacitor.registerPlugin('Share');
   const r=await FS.writeFile({path:name,data:text,directory:'CACHE',encoding:'utf8'});
   await SH.share({title:name,url:r.uri,dialogTitle:'Simpan atau kirim file'});
  }catch(e){const m=String((e&&e.message)||e);if(!/cancel/i.test(m))toast('Gagal membagikan file: '+m);}
  return;
 }
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
function cetakLaporan(){
 if(!NATIVE){window.print();return;}
 const css=document.querySelector('style').textContent;
 const html='<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laporan Keuangan</title><style>'+css+'body{padding:12px}.noprint{display:none!important}.printonly{display:block}</style></head><body><main>'+$('#app').innerHTML+'</main></body></html>';
 download(html,'text/html;charset=utf-8','laporan-'+(S.lapMode==='semua'?'semua':S.bulanLap)+'.html');
}
function csv(){
 const list=periodTrx().slice().sort(cmpAsc);
 const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
 const rows=[['Tanggal','Jenis','Kategori','Murid atau guru','Bulan','Keterangan','Jumlah'].map(q).join(',')];
 list.forEach(t=>rows.push([t.tgl,t.tipe==='masuk'?'Masuk':'Keluar',t.kategori,muridNama(t.muridId)||guruNama(t.guruId),t.bulan,t.ket,t.jumlah].map(q).join(',')));
 download('﻿'+rows.join('\r\n'),'text/csv;charset=utf-8','kas-'+(S.lapMode==='semua'?'semua':S.bulanLap)+'.csv');
}


/* ---------- catatan belajar ---------- */
const catAll=()=>live('cat');
function bolehUbahCat(c){const p=peran();return p==='admin'||p==='pengisi'||(p==='guru'&&c.oleh===SES.u);}
function muridAktifUrut(){return muridAll().filter(m=>m.aktif).sort((a,b)=>a.nama.localeCompare(b.nama));}
function vCatatan(){
 const ym=S.bulanCat,mid=S.catMurid;
 const ms=muridAktifUrut();
 if(mid&&!DB.recs.murid[mid])S.catMurid='';
 let list=catAll().filter(c=>(c.tgl||'').slice(0,7)===ym&&(!S.catMurid||c.muridId===S.catMurid));
 list.sort((a,b)=>(b.tgl||'').localeCompare(a.tgl||'')||b.id.localeCompare(a.id));
 const baris=c=>`<div class="item" onclick="detailCat('${c.id}')"><div class="grow"><div><b>${esc(muridNama(c.muridId)||'Murid dihapus')}</b> &middot; ${tglIndo(c.tgl)}</div><div class="mut">${esc((c.materi||'').slice(0,90))}${(c.materi||'').length>90?'...':''}</div><div class="mut">Guru: ${esc(c.olehNama||c.oleh||'-')}</div></div><span class="mut">&#8250;</span></div>`;
 return `<div class="card"><div class="grid2"><div><label style="margin-top:0">Bulan</label><input type="month" value="${ym}" onchange="S.bulanCat=this.value||thisMonth();render()"></div>
 <div><label style="margin-top:0">Murid</label><select onchange="S.catMurid=this.value;render()"><option value="">Semua murid</option>${ms.map(m=>`<option value="${m.id}" ${m.id===S.catMurid?'selected':''}>${esc(m.nama)}</option>`).join('')}</select></div></div>
 ${can('catat')?`<div class="grid2" style="margin-top:12px"><button onclick="formCatMassal()">Isi catatan massal</button><button class="btn2" onclick="formWAMassal()">Kirim WA massal</button></div>`:''}
 ${S.catMurid&&list.length?`<button class="btn2 full" style="margin-top:8px" onclick="kirimWA('${S.catMurid}','${ym}')">Kirim rekap ${namaBulan(ym)} murid ini ke WA</button>`:''}</div>
 <div class="card"><h2>${list.length} catatan</h2>${list.length?list.map(baris).join(''):'<div class="empty">Belum ada catatan di bulan ini.'+(can('catat')?' Tekan tombol + untuk menambah catatan pertemuan.':'')+'</div>'}</div>`;
}
function formCat(id,pre){
 if(!can('catat'))return deny();
 const c=id?getRec('cat',id):Object.assign({id:'',muridId:S.catMurid||'',tgl:today(),materi:'',kembang:''},pre||{});
 if(!c)return;
 if(id&&!bolehUbahCat(c))return deny();
 const ms=muridAktifUrut();
 if(!ms.length&&!id)return toast('Belum ada murid. Minta admin menambahkan murid dulu.');
 openSheet(`<h2>${id?'Ubah catatan':'Catatan pertemuan'}</h2>
 <label>Murid</label><select id="c_m">${(id&&!ms.some(m=>m.id===c.muridId)&&DB.recs.murid[c.muridId]?[DB.recs.murid[c.muridId]].concat(ms):ms).map(m=>`<option value="${m.id}" ${m.id===c.muridId?'selected':''}>${esc(m.nama)}${m.kelas?' (kelas '+esc(m.kelas)+')':''}</option>`).join('')}</select>
 <label>Tanggal</label><input id="c_t" type="date" value="${c.tgl}">
 <label>Materi</label><textarea id="c_a" rows="3" placeholder="Contoh: Perkalian 6 dan 7">${esc(c.materi)}</textarea>
 <label>Perkembangan</label><textarea id="c_b" rows="4" placeholder="Contoh: Sudah hafal perkalian 6, perlu latihan untuk 7">${esc(c.kembang)}</textarea>
 <div style="display:grid;gap:8px;margin-top:14px"><button onclick="saveCat('${id||''}')">Simpan</button>${id?`<button class="btnr" onclick="hapusCat('${id}')">Hapus catatan</button>`:''}<button class="btn2" onclick="${id?`detailCat('${id}')`:'closeSheet()'}">Batal</button></div>`);
}
function saveCat(id){
 const muridId=$('#c_m').value,tgl=$('#c_t').value,materi=$('#c_a').value.trim(),kembang=$('#c_b').value.trim();
 if(!muridId)return toast('Pilih murid dulu');
 if(!tgl)return toast('Isi tanggal dulu');
 if(!materi&&!kembang)return toast('Isi materi atau perkembangan');
 const nama=muridNama(muridId);
 const lama=id?getRec('cat',id):null;
 const o=lama?{id,muridId,tgl,materi,kembang}:{muridId,tgl,materi,kembang,oleh:ONLINE?SES.u:'admin',olehNama:ONLINE?SES.nama:(SET().lembaga||'Guru')};
 if(id)o.id=id;
 if(done((id?'Mengubah':'Mencatat')+' catatan belajar '+nama,()=>putRec('cat',o),'Catatan tersimpan')){S.bulanCat=tgl.slice(0,7);if(S.tab==='catatan')render();}
}
function hapusCat(id){
 const c=getRec('cat',id);if(!c||!bolehUbahCat(c))return deny();
 if(!confirm('Hapus catatan ini?'))return;
 done('Menghapus catatan belajar '+muridNama(c.muridId),()=>delRec('cat',id),'Catatan dihapus');
}
function detailCat(id){
 const c=getRec('cat',id);if(!c)return closeSheet();
 const m=DB.recs.murid[c.muridId];
 openSheet(`<h2>${esc(m?m.nama:'Murid dihapus')}</h2>
 <p class="mut" style="margin-top:-6px">${tglIndo(c.tgl)} &middot; Guru: ${esc(c.olehNama||c.oleh||'-')}</p>

function nomorWA(hp){
 let d=String(hp||'').replace(/\D/g,'');
 if(!d)return '';
 if(d.startsWith('00'))d=d.slice(2);
 if(d.startsWith('0'))d='62'+d.slice(1);
 else if(d.startsWith('8'))d='62'+d;
 return d.length>=9?d:'';
}
function teksLaporan(m,list){
 const lem=SET().lembaga||'Rumah Belajar Maryam';
 const isi=list.map(c=>`Tanggal: ${tglIndo(c.tgl)}\nMateri: ${c.materi||'-'}\nPerkembangan: ${c.kembang||'-'}`+(list.length>1?'':`\nGuru: ${c.olehNama||c.oleh||'-'}`)).join('\n\n');
 return `Assalamualaikum Bapak/Ibu, wali dari ${m.nama}.\nBerikut laporan belajar ${m.nama} di ${lem}:\n\n${isi}\n\nTerima kasih atas perhatian dan dukungannya.\n${lem}`;
}
function kirimWA(muridId,ym,catId){
 const m=DB.recs.murid[muridId];if(!m)return;
 const list=catId?[getRec('cat',catId)].filter(Boolean):catAll().filter(c=>c.muridId===muridId&&(c.tgl||'').slice(0,7)===ym).sort((a,b)=>(a.tgl||'').localeCompare(b.tgl||''));
 if(!list.length)return toast('Belum ada catatan untuk dikirim');
 const teks=teksLaporan(m,list),no=nomorWA(m.hp);
 openSheet(`<h2>Kirim ke WA wali</h2>
 <p class="mut" style="margin-top:-6px">${esc(m.nama)} &middot; ${no?'WA '+esc(m.hp):'Nomor WA wali belum diisi, kontaknya dipilih sendiri di WhatsApp'}</p>
 <label>Pesan (boleh diubah dulu)</label><textarea id="wa_t" rows="10">${esc(teks)}</textarea>
 <div style="display:grid;gap:8px;margin-top:14px"><button onclick="bukaWA('${no}')">Buka WhatsApp</button><button class="btn2" onclick="salinWA()">Salin pesan</button><button class="btn2" onclick="closeSheet()">Tutup</button></div>`);
}
function bukaWA(no){
 const t=$('#wa_t').value;
 const url='https://wa.me/'+no+'?text='+encodeURIComponent(t);
 const w=window.open(url,'_blank');
 if(!w)location.href=url;
}
async function salinWA(){
 const el=$('#wa_t');
 try{await navigator.clipboard.writeText(el.value);toast('Pesan disalin');}
 catch(e){el.select();try{document.execCommand('copy');toast('Pesan disalin');}catch(_){toast('Tekan lama pada pesan lalu pilih Salin');}}
}

let CM={tgl:'',materi:'',prog:'',rows:{}};
function programList(){return [...new Set(muridAktifUrut().map(m=>(m.program||'').trim()).filter(Boolean))].sort();}
function syncCM(){
 const g=i=>document.getElementById(i);if(!g('cm_t'))return;
 CM.tgl=g('cm_t').value;CM.materi=g('cm_a').value;
 document.querySelectorAll('[data-cm]').forEach(r=>{const id=r.dataset.cm;CM.rows[id]={on:r.querySelector('input[type=checkbox]').checked,k:r.querySelector('textarea').value};});
}
function formCatMassal(){
 if(!can('catat'))return deny();
 if(!muridAktifUrut().length)return toast('Belum ada murid. Minta admin menambahkan murid dulu.');
 CM={tgl:today(),materi:'',prog:'',rows:{}};drawCM();
}
function drawCM(){
 const progs=programList();
 const ms=muridAktifUrut().filter(m=>!CM.prog||(m.program||'').trim()===CM.prog);
 const adaHariIni=m=>catAll().some(c=>c.muridId===m.id&&c.tgl===CM.tgl);
 const dipilih=ms.filter(m=>(CM.rows[m.id]||{}).on).length;
 openSheet(`<h2>Catatan massal</h2>
 <p class="mut" style="margin-top:-6px">Satu pertemuan untuk banyak murid. Isi materi sekali, lalu perkembangan tiap murid.</p>
 <label>Tanggal</label><input id="cm_t" type="date" value="${CM.tgl}" onchange="syncCM();drawCM()">
 <label>Materi (sama untuk semua yang dipilih)</label><textarea id="cm_a" rows="2" placeholder="Contoh: Perkalian 6 dan 7">${esc(CM.materi)}</textarea>
 ${progs.length>1?`<label>Tampilkan program</label><select onchange="syncCM();CM.prog=this.value;drawCM()"><option value="">Semua program</option>${progs.map(x=>`<option ${x===CM.prog?'selected':''}>${esc(x)}</option>`).join('')}</select>`:''}
 <div class="row" style="margin:12px 0 4px"><div class="grow mut">${dipilih} murid dipilih</div><button class="btn2" onclick="cmSemua(true)">Pilih semua</button><button class="btn2" onclick="cmSemua(false)">Kosongkan</button></div>
 <div style="max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:0 10px">
 ${ms.map(m=>{const r=CM.rows[m.id]||{on:false,k:''};return `<div data-cm="${m.id}" style="padding:10px 0;border-bottom:1px solid var(--line)"><label class="row" style="margin:0 0 6px;color:inherit"><input type="checkbox" style="width:auto" ${r.on?'checked':''}> <b>${esc(m.nama)}</b>${m.kelas?' <span class="mut">kelas '+esc(m.kelas)+'</span>':''}${adaHariIni(m)?' <span class="badge b-off">sudah ada hari ini</span>':''}</label><textarea rows="2" placeholder="Perkembangan ${esc(m.nama)}" oninput="if(this.value)this.parentNode.querySelector('input').checked=true">${esc(r.k)}</textarea></div>`;}).join('')}
 </div>
 <div style="display:grid;gap:8px;margin-top:14px"><button onclick="saveCM()">Simpan catatan</button><button class="btn2" onclick="closeSheet()">Batal</button></div>`);
}
function cmSemua(v){syncCM();muridAktifUrut().filter(m=>!CM.prog||(m.program||'').trim()===CM.prog).forEach(m=>{CM.rows[m.id]=Object.assign({k:''},CM.rows[m.id],{on:v});});drawCM();}
function saveCM(){
 syncCM();
 if(!CM.tgl)return toast('Isi tanggal dulu');
 const materi=CM.materi.trim();
 const pilih=muridAktifUrut().filter(m=>(CM.rows[m.id]||{}).on);
 if(!pilih.length)return toast('Pilih murid dulu');
 if(!materi&&!pilih.some(m=>CM.rows[m.id].k.trim()))return toast('Isi materi atau perkembangan');
 const oleh=ONLINE?SES.u:'admin',olehNama=ONLINE?SES.nama:(SET().lembaga||'Guru');
 if(done('Mencatat '+pilih.length+' catatan belajar sekaligus',()=>pilih.forEach(m=>putRec('cat',{muridId:m.id,tgl:CM.tgl,materi,kembang:CM.rows[m.id].k.trim(),oleh,olehNama})),pilih.length+' catatan tersimpan')){S.bulanCat=CM.tgl.slice(0,7);S.catMurid='';if(S.tab==='catatan')render();}

/* ---------- laporan WA massal ---------- */
let CW={mode:'hari',tgl:'',ym:''};
const waSent=()=>{try{return JSON.parse(lsGet('rbm_wasent')||'{}');}catch(e){return {};}};
function waTandai(k){const o=waSent();o[k]=Date.now();const ks=Object.keys(o);if(ks.length>400)ks.sort((a,b)=>o[a]-o[b]).slice(0,ks.length-400).forEach(x=>delete o[x]);lsSet('rbm_wasent',JSON.stringify(o));}
function formWAMassal(){
 if(!can('catat'))return deny();
 CW={mode:'hari',tgl:today(),ym:S.bulanCat};drawWA();
}
function waItems(){
 const sent=waSent();
 const dalam=c=>CW.mode==='hari'?c.tgl===CW.tgl:(c.tgl||'').slice(0,7)===CW.ym;
 const per={};
 catAll().filter(dalam).forEach(c=>{(per[c.muridId]=per[c.muridId]||[]).push(c);});
 return Object.keys(per).filter(id=>DB.recs.murid[id]).map(id=>{
  const list=per[id].sort((a,b)=>(a.tgl||'').localeCompare(b.tgl||'')||a.id.localeCompare(b.id));
  const key=id+'|'+list.map(c=>c.id+':'+c.upd).join(',');
  return {m:DB.recs.murid[id],list,key,sudah:!!sent[key],no:nomorWA(DB.recs.murid[id].hp)};
 }).sort((a,b)=>(a.sudah-b.sudah)||a.m.nama.localeCompare(b.m.nama));
}
function drawWA(){
 const it=waItems(),belum=it.filter(x=>!x.sudah).length;
 openSheet(`<h2>Kirim laporan WA massal</h2>
 <p class="mut" style="margin-top:-6px">WhatsApp dibuka satu murid per satu. Setelah menekan Kirim di WhatsApp, kembali ke aplikasi ini lalu lanjut ke murid berikutnya.</p>
 <div class="seg"><button class="${CW.mode==='hari'?'on':''}" onclick="CW.mode='hari';drawWA()">Satu tanggal</button><button class="${CW.mode==='bulan'?'on':''}" onclick="CW.mode='bulan';drawWA()">Satu bulan</button></div>
 ${CW.mode==='hari'?`<label>Tanggal</label><input type="date" value="${CW.tgl}" onchange="CW.tgl=this.value||today();drawWA()">`:`<label>Bulan</label><input type="month" value="${CW.ym}" onchange="CW.ym=this.value||thisMonth();drawWA()">`}
 <p style="margin:12px 0 4px"><b>${it.length}</b> murid punya catatan, <b>${belum}</b> belum dikirim.</p>
 <div style="max-height:46vh;overflow:auto">
 ${it.length?it.map((x,i)=>`<div class="item" style="cursor:default"><div class="grow"><div>${x.sudah?'&#10003; ':''}${esc(x.m.nama)}</div><div class="mut">${x.list.length} catatan &middot; ${x.no?'WA '+esc(x.m.hp):'nomor belum diisi, pilih kontak sendiri'}</div></div><button class="${x.sudah?'btn2':''}" onclick="waKirimSatu(${i})">${x.sudah?'Kirim lagi':'Kirim'}</button></div>`).join(''):'<div class="empty">Tidak ada catatan pada pilihan ini.</div>'}
 </div>
 <button class="btn2 full" style="margin-top:12px" onclick="closeSheet()">Tutup</button>`);
}
function waKirimSatu(i){
 const x=waItems()[i];if(!x)return;
 waTandai(x.key);
 const url='https://wa.me/'+x.no+'?text='+encodeURIComponent(teksLaporan(x.m,x.list));
 const w=window.open(url,'_blank');
 if(!w)location.href=url;
 setTimeout(drawWA,300);
}

  <div class="card"><h2>Kategori uang keluar</h2>${chips(s.katKeluar,'keluar')}<div class="row" style="margin-top:8px"><input id="k_keluar" placeholder="Kategori baru"><button onclick="addKat('keluar')">Tambah</button></div></div>`:'';
 const cadangan=adm?`<div class="card"><h2>Cadangan data</h2>

  <label class="btn btn2" style="text-align:center;margin:0">Pulihkan dari file cadangan<input type="file" accept=".json,application/json" style="display:none" onchange="restoreFile(this)"></label></div></div>`:'';
 const pasang=NATIVE?'':`<div class="card"><h2>Pasang aplikasi</h2><p class="mut" style="margin:0">Di Chrome, buka menu titik tiga lalu pilih Tambahkan ke layar utama atau Pasang aplikasi.</p></div>`;
 const hapus=adm?`<div class="card"><h2>Mulai dari nol</h2><p class="mut">Menghapus semua murid, guru, dan transaksi${ONLINE?' di server dan di semua perangkat':''}. Tidak bisa dibatalkan. Gunakan hanya untuk membuang data uji coba.</p><button class="btnr full" onclick="formHapusSemua()">Hapus semua data</button></div>`:'';
 return akun+riwayat+kelola+lembaga+cadangan+pasang+hapus;
}
function addKat(j){
 const el=$('#k_'+j),v=el.value.trim();if(!v)return;
 const arr=(j==='masuk'?SET().katMasuk:SET().katKeluar).slice();
 if(arr.some(x=>x.toLowerCase()===v.toLowerCase()))return toast('Kategori sudah ada');
 arr.push(v);
 saveSet('Menambah kategori '+v,j==='masuk'?{katMasuk:arr}:{katKeluar:arr});
}
function delKat(j,i){
 const arr=(j==='masuk'?SET().katMasuk:SET().katKeluar).slice();
 const nama=arr[i];arr.splice(i,1);
 saveSet('Menghapus kategori '+nama,j==='masuk'?{katMasuk:arr}:{katKeluar:arr});
}
function backup(){
 const recs={};KOLEKSI.forEach(c=>{recs[c]=live(c);});
 DB.lastBackup=new Date().toISOString();persist();
 download(JSON.stringify({v:2,app:'kas-rbm',dibuat:DB.lastBackup,recs},null,1),'application/json','kas-rbm-'+today()+'.json');
 render();toast('Cadangan diunduh');
}
function restoreFile(inp){
 if(!can('admin'))return deny();
 const f=inp.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
  try{
   const recs=toRecs(JSON.parse(r.result));
   if(!recs)throw 0;
   const n=sum(KOLEKSI,c=>(recs[c]||[]).length);
   if(!confirm('File cadangan berisi '+n+' catatan. Catatan itu akan ditambahkan, dan yang sama akan ditimpa dengan isi file. Lanjutkan?'))return;
   adoptRecs(DB,recs,true);touch();persist();scheduleSync();render();toast(n+' catatan dipulihkan');
  }catch(e){toast('File cadangan tidak dikenali');}
 };
 r.readAsText(f);inp.value='';
}

 openSheet(`<h2>Hapus semua data?</h2><p>Semua murid, guru, transaksi, dan catatan belajar akan dihapus${ONLINE?' dari server dan semua perangkat':''}. Pengaturan lembaga tetap ada. Tindakan ini tidak bisa dibatalkan.</p>

}
function doHapusSemua(){
 if($('#hp_k').value.trim().toUpperCase()!=='HAPUS')return toast('Ketik HAPUS dulu');
 ['murid','guru','trx','cat'].forEach(c=>Object.keys(DB.recs[c]).forEach(id=>{const r=DB.recs[c][id];if(!r.del)putRaw(c,id,Object.assign({},r,{del:1}));}));
 DB.hist=[];DB.logQ.push({t:Date.now(),x:'Menghapus semua data'});
 persist();scheduleSync();closeSheet();render();toast('Semua data dihapus');
}
